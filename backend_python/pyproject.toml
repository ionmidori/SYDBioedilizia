[project]
name = "backend-python"
version = "4.0.0"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.140.0",
    "starlette>=1.3.1",
    "firebase-admin>=7.5.0",
    "google-cloud-aiplatform>=1.162.0",
    "google-cloud-firestore>=2.28.0",
    "google-genai>=2.14.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pinecone>=9.1.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.51.0",
    "pydantic-settings>=2.14.2",
    "ezdxf>=1.4.4",
    "python-dateutil>=2.9.0.post0",
    "slowapi>=0.1.10",
    "google-adk>=2.5.0",
    "aiosmtplib>=5.1.2",
    "reportlab>=5.0.0",
    "google-cloud-modelarmor>=0.7.1",
    "fido2>=2.2.1",
    "pypdf>=6.14.2",
    "cryptography>=49.0.0",
    # Transitive of the google-cloud / vertex / firestore stack. Pinned above the
    # YANKED 1.78.1 ("caused major outage with gcloud serverless environments"),
    # which uv would otherwise keep resolving on Cloud Run.
    "grpcio>=1.83.0",
    # Cloud Trace span exporter used by src/core/tracing.py in production. Was
    # imported but never declared, so the prod try/except silently fell back to
    # the console exporter and traces never reached GCP Cloud Trace.
    "opentelemetry-exporter-gcp-trace>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]
# One-off debug/ops scripts are not held to lint standards (see scripts/debug/README.md)
extend-exclude = ["scripts"]

[tool.ruff.lint]
# Incremental adoption (ratchet), same convention as pyrightconfig.json: a rule family is
# enabled here only once its whole backlog is at zero, so the CI gate blocks NEW findings.
# Base set: pyflakes (F), pycodestyle errors/warnings (E/W), import sorting (I).
#
# UP (pyupgrade): RATCHETED (2026-07-26). 414 findings cleared in two passes — 408 mechanical
# in PR #250 (Optional[X] -> X | None, Dict/List -> dict/list, typing -> collections.abc,
# timezone.utc -> datetime.UTC; baseline measured on 2cb61b4, the commit before it), then in
# PR #251 the 6 that change runtime semantics: UP042 converted ProjectStatus,
# PropertyType and _State to StrEnum (safe because all four model_config carry
# use_enum_values=True, so Firestore already persists .value, and no call-site formats a member
# with str()/f-string), and UP047 moved parse_enum/run_blocking to PEP 695 generics.
#
# B (bugbear): RATCHETED (2026-07-26) in PR #252. B008 (51 findings, all Depends()/File()/
# Security() in FastAPI signature defaults — the framework's own recommended pattern, not the
# shared-mutable-default bug B008 looks for) closed via extend-immutable-calls below, zero code
# changes. B904 (69 findings) fixed with `raise ... from e`/`from None` per call-site. B017
# (1 finding, tests/unit/test_core_modules.py) narrowed to the concrete exception type.
#
# BLE001 (blind-except): RATCHETED (2026-07-26) in PR #253, baselined with per-line noqa rather
# than per-file-ignores — a per-file baseline would keep waving through NEW blind-excepts in the
# 45 files already listed, whereas per-line directives protect new code from day one.
# src/db/projects.py was cleared for real instead of baselined, because that is where the rule
# was hiding actual fail-open bugs: count_user_projects returned 0 when Firestore was down
# (silently lifting the 5-project quota in projects_router.create_project), the per-project quote
# lookup swallowed permission/index errors with `except Exception: pass`, and the GDPR hard purge
# reported success while orphaned blobs survived on GCS. All three now fail closed, with
# regression tests in tests/unit/test_projects.py::TestProjectsFailClosed.
# 75 sites are baselined here; with the one directive that predates this PR
# (src/utils/stream_protocol.py:203) that leaves 76 blind-except handlers still suppressed.
# RULE: do not add a new `# noqa: BLE001` — narrow the caught
# exception, or make the handler observable and justify the directive inline (see projects.py).
# Clearing a module means deleting its directives, not moving them.
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "BLE001"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection: Depends()/File()/Security()/etc. in argument defaults is the
# framework-recommended pattern, not the shared-mutable-default bug B008 targets.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Security", "fastapi.Query",
    "fastapi.Form", "fastapi.Body", "fastapi.Header", "fastapi.Path",
]

[tool.ruff.lint.per-file-ignores]
# load_dotenv(".env") MUST run before google-adk/google-genai imports (see CLAUDE.md)
"main.py" = ["E402"]
# Test/benchmark scripts use sys.path or env setup before imports
"tests/**" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Exclude live-API tests by default so a plain `pytest` run never calls the real
# Gemini API (no quota/cost). Opt in explicitly with: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests as integration tests (requiring live API)",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "ruff>=0.16.0",
    "pyright>=1.1.411",
]
