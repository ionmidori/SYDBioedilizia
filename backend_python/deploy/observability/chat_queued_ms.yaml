# Log-based distribution metric over the `chat_turn_timing` log line
# (src/core/chat_timing.py). Applied by apply.sh.
name: chat_queued_ms
description: "Request arrival to route handler (cold-start warm-up wait), ms. Label cold_start separates first turns of a new instance."
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="syd-brain"
  AND jsonPayload.event="chat_turn_timing"
  AND jsonPayload.queued_ms>0
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: ms
  labels:
  - key: cold_start
    valueType: STRING
    description: "True on the first chat turn served by an instance"
valueExtractor: EXTRACT(jsonPayload.queued_ms)
labelExtractors:
  cold_start: EXTRACT(jsonPayload.cold_start)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 64
    growthFactor: 1.2
    scale: 50
