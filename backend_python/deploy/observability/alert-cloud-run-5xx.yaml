# Alert: more than 2 HTTP 5xx answers from syd-brain in 5 minutes.
displayName: "Cloud Run 5xx (syd-brain)"
combiner: OR
alertStrategy:
  autoClose: 1800s
conditions:
- displayName: "5xx > 2 in 5 min"
  conditionThreshold:
    filter: >-
      metric.type="run.googleapis.com/request_count"
      AND resource.type="cloud_run_revision"
      AND resource.label.service_name="syd-brain"
      AND metric.label.response_code_class="5xx"
    aggregations:
    - alignmentPeriod: 300s
      perSeriesAligner: ALIGN_SUM
      crossSeriesReducer: REDUCE_SUM
    comparison: COMPARISON_GT
    thresholdValue: 2
    duration: 0s
documentation:
  content: >-
    syd-brain answers with 5xx errors. Look at the Cloud Run request logs
    (`httpRequest.status>=500`) and at the revision serving traffic
    (`gcloud run services describe syd-brain --region=europe-west1`).
  mimeType: text/markdown
