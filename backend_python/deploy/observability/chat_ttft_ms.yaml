# Log-based distribution metric over the `chat_turn_timing` log line
# (src/core/chat_timing.py). Applied by apply.sh.
name: chat_ttft_ms
description: "Time to first visible text of a chat turn (from request arrival), ms. Label cold_start separates first turns of a new instance."
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="syd-brain"
  AND jsonPayload.event="chat_turn_timing"
  AND jsonPayload.first_text_ms>0
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: ms
  labels:
  - key: cold_start
    valueType: STRING
    description: "True on the first chat turn served by an instance"
valueExtractor: EXTRACT(jsonPayload.first_text_ms)
labelExtractors:
  cold_start: EXTRACT(jsonPayload.cold_start)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 64
    growthFactor: 1.2
    scale: 50
