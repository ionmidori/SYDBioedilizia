name: 'Security Audit (root npm + admin_tool)'

# Closes the CI coverage gap: backend_python (pip-audit) and web_client
# (npm audit) are already gated in their own workflows, but the root npm
# tooling lockfile and the admin_tool Python deps had no audit gate, so
# advisories there only surfaced via the Dependabot dashboard. This job
# fails the build on actionable (production-affecting) vulnerabilities.

on:
  push:
    branches: ['main', 'develop']
    paths:
      - 'package-lock.json'
      - 'package.json'
      - 'admin_tool/pyproject.toml'
      - 'admin_tool/uv.lock'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: ['main', 'develop']
    paths:
      - 'package-lock.json'
      - 'package.json'
      - 'admin_tool/pyproject.toml'
      - 'admin_tool/uv.lock'
      - '.github/workflows/security-audit.yml'
  schedule:
    # Weekly safety net — catches newly-published advisories even when no
    # manifest changed.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

# Least privilege: audit jobs only read the repo.
permissions:
  contents: read

concurrency:
  group: 'security-audit-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  root-npm-audit:
    name: 'Root npm audit'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      # Production deps must be clean at high+. NOTE: gray-matter (used at
      # runtime by web_client/lib/blog.ts) pulls a legacy js-yaml 3.x line as
      # a transitive dependency and IS in scope here -- its advisories are
      # not dev-only and this step intentionally fails on them (see the
      # `js-yaml`/`nanoid` overrides in package.json). Only genuinely
      # dev-only advisories are left to Dependabot PRs.
      - name: 'Audit production dependencies (fail on high/critical)'
        run: npm audit --omit=dev --audit-level=high

  admin-tool-audit:
    name: 'admin_tool pip-audit'
    runs-on: 'ubuntu-latest'
    defaults:
      run:
        working-directory: './admin_tool'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Tracks the base image in admin_tool/Dockerfile: pip-audit resolves
          # against the interpreter it runs on, so auditing 3.12 wheels while
          # Cloud Run ships 3.14 would audit a tree that is not deployed.
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 'latest'
      - name: 'Install locked dependencies'
        # --locked: audit the resolution the Dockerfile actually ships, not a
        # fresh re-resolve of the floors in pyproject.toml.
        run: uv sync --locked
      - name: 'Audit admin_tool dependencies'
        run: uv run pip-audit --strict --desc

  dependabot-alert-freshness:
    name: 'Dependabot alert freshness'
    # Scheduled only, not on push/PR: this checks repo-wide state, not the
    # diff of a specific change, so it belongs on the same weekly cadence as
    # the "newly-published advisories" safety net above, not on every commit.
    #
    # Why this job exists: a high/critical Dependabot alert can end up with
    # NO associated PR at all if Dependabot itself cannot resolve a fix (a
    # pinned transitive range, a workspace conflict, etc -- see the
    # `Dependabot Updates` workflow's own run history, which fails silently
    # with `conflicting-dependencies` in that case). Every other gate in this
    # repo watches PRs; none of them notice an alert that never got one. That
    # gap sat unnoticed for js-yaml (alert #190/#191) and nanoid (#186) until
    # a manual audit found it days later -- this job is the automated version
    # of that audit.
    if: "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'"
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
      # Required to call the Dependabot alerts API with the built-in token.
      security-events: read
    env:
      GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      REPO: '${{ github.repository }}'
      # Generous relative to the weekly cron: a fresh alert should get a
      # Dependabot PR (or a human fix) well within one cadence cycle. Stale
      # past that means something -- Dependabot failing silently, or a human
      # PR stuck -- and is worth a red build, not another silent week.
      MAX_AGE_DAYS: '10'
    steps:
      - name: 'Fail on stale high/critical open alerts'
        run: |
          set -euo pipefail

          alerts="$(gh api "repos/$REPO/dependabot/alerts" --paginate \
            -q '[.[] | select(.state == "open") | select(.security_advisory.severity == "high" or .security_advisory.severity == "critical")]')"

          now_epoch="$(date -u +%s)"
          stale="$(printf '%s' "$alerts" | jq --argjson now "$now_epoch" --argjson maxAge "$MAX_AGE_DAYS" '
            [.[] | . as $a
             | (($now - (($a.created_at | fromdateiso8601))) / 86400 | floor) as $ageDays
             | select($ageDays >= $maxAge)
             | {number: $a.number, package: $a.dependency.package.name, severity: $a.security_advisory.severity, ageDays: $ageDays, url: $a.html_url}]')"

          count="$(printf '%s' "$stale" | jq 'length')"

          if [ "$count" -gt 0 ]; then
            echo "::error::$count high/critical Dependabot alert(s) have been open for >= ${MAX_AGE_DAYS} days with no resolution:"
            printf '%s' "$stale" | jq -r '.[] | "  - #\(.number) \(.package) (\(.severity), \(.ageDays)d open) -> \(.url)"'
            echo ""
            echo "If Dependabot could not generate a fix PR on its own (check the"
            echo "'Dependabot Updates' workflow runs for 'conflicting-dependencies'"
            echo "errors), a manual override/patch is required -- see PR #307 for"
            echo "the pattern (js-yaml/nanoid version overrides + surgical lockfile"
            echo "edit) used the last time this happened."
            exit 1
          fi

          echo "No stale high/critical Dependabot alerts (threshold: ${MAX_AGE_DAYS} days)."
