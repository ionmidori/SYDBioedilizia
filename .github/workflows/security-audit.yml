name: 'Security Audit (root npm + admin_tool)'

# Closes the CI coverage gap: backend_python (pip-audit) and web_client
# (npm audit) are already gated in their own workflows, but the root npm
# tooling lockfile and the admin_tool Python deps had no audit gate, so
# advisories there only surfaced via the Dependabot dashboard. This job
# fails the build on actionable (production-affecting) vulnerabilities.

on:
  push:
    branches: ['main', 'develop']
    paths:
      - 'package-lock.json'
      - 'package.json'
      - 'admin_tool/pyproject.toml'
      - 'admin_tool/uv.lock'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: ['main', 'develop']
    paths:
      - 'package-lock.json'
      - 'package.json'
      - 'admin_tool/pyproject.toml'
      - 'admin_tool/uv.lock'
      - '.github/workflows/security-audit.yml'
  schedule:
    # Weekly safety net — catches newly-published advisories even when no
    # manifest changed.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

# Least privilege: audit jobs only read the repo.
permissions:
  contents: read

concurrency:
  group: 'security-audit-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  root-npm-audit:
    name: 'Root npm audit'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      # Production deps must be clean at high+. NOTE: gray-matter (used at
      # runtime by web_client/lib/blog.ts) pulls a legacy js-yaml 3.x line as
      # a transitive dependency and IS in scope here -- its advisories are
      # not dev-only and this step intentionally fails on them (see the
      # `js-yaml`/`nanoid` overrides in package.json). Only genuinely
      # dev-only advisories are left to Dependabot PRs.
      - name: 'Audit production dependencies (fail on high/critical)'
        run: npm audit --omit=dev --audit-level=high

  admin-tool-audit:
    name: 'admin_tool pip-audit'
    runs-on: 'ubuntu-latest'
    defaults:
      run:
        working-directory: './admin_tool'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Tracks the base image in admin_tool/Dockerfile: pip-audit resolves
          # against the interpreter it runs on, so auditing 3.12 wheels while
          # Cloud Run ships 3.14 would audit a tree that is not deployed.
          python-version: '3.14'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 'latest'
      - name: 'Install locked dependencies'
        # --locked: audit the resolution the Dockerfile actually ships, not a
        # fresh re-resolve of the floors in pyproject.toml.
        run: uv sync --locked
      - name: 'Audit admin_tool dependencies'
        run: uv run pip-audit --strict --desc

  dependabot-alert-freshness:
    name: 'Dependabot alert freshness'
    # Scheduled only, not on push/PR: this checks repo-wide state, not the
    # diff of a specific change, so it belongs on the same weekly cadence as
    # the "newly-published advisories" safety net above, not on every commit.
    #
    # Why this job exists: a high/critical Dependabot alert can end up with
    # NO associated PR at all if Dependabot itself cannot resolve a fix (a
    # pinned transitive range, a workspace conflict, etc -- see the
    # `Dependabot Updates` workflow's own run history, which fails silently
    # with `conflicting-dependencies` in that case). Every other gate in this
    # repo watches PRs; none of them notice an alert that never got one. That
    # gap sat unnoticed for js-yaml (alert #190/#191) and nanoid (#186) until
    # a manual audit found it days later -- this job is the automated version
    # of that audit.
    if: "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'"
    runs-on: 'ubuntu-latest'
    # Confinamento del secret. `DEPENDABOT_ALERTS_TOKEN` e' un ENVIRONMENT
    # secret, non un repository secret: un repository secret sarebbe leggibile
    # da qualunque workflow su qualunque ref, e questo repo e' PUBBLICO
    # (chiunque puo' aprire una PR; chi ha write puo' pushare un branch e
    # lanciarlo via workflow_dispatch). L'environment `dependabot-alerts` ha
    # una deployment branch policy che ammette solo `main`, quindi un job che
    # gira da un altro ref non ottiene il token nemmeno dichiarando
    # l'environment. Gli eventi `schedule` girano sempre sul default branch,
    # quindi la restrizione non limita l'uso legittimo.
    environment: 'dependabot-alerts'
    # Il GITHUB_TOKEN integrato non serve a questo job: non fa checkout, non
    # legge il repo, non scrive nulla. Zero permessi = zero da rubare.
    permissions: {}
    env:
      REPO: '${{ github.repository }}'
      # Generous relative to the weekly cron: a fresh alert should get a
      # Dependabot PR (or a human fix) well within one cadence cycle. Stale
      # past that means something -- Dependabot failing silently, or a human
      # PR stuck -- and is worth a red build, not another silent week.
      MAX_AGE_DAYS: '10'
    # NB: questo job non deve MAI acquisire un `actions/checkout` o una action
    # di terze parti. Cosi' com'e', il token non condivide il runner con
    # codice che non sia questo `run:` -- e' la ragione principale per cui il
    # raggio d'azione di una compromissione qui e' nullo. Se un giorno serve
    # del codice dal repo, spostarlo in un job separato SENZA il token.
    steps:
      - name: 'Fail on stale high/critical open alerts'
        env:
          # A livello di step, non di job: nessun altro step erediterebbe il
          # token se qualcuno ne aggiungesse uno.
          #
          # NON e' `secrets.GITHUB_TOKEN`. Il token integrato di Actions NON
          # puo' leggere l'API Dependabot alerts: risponde sempre
          # `Resource not accessible by integration (HTTP 403)`, anche con
          # `permissions: security-events: read` (provato -- questo job e'
          # andato in failure per quel motivo ad ogni run schedulato dal 17 al
          # 31 Ago 2026, cioe' da quando e' stato introdotto in PR #313 fino
          # alla PR che lo ha corretto: l'allarme era morto alla nascita e non
          # ha mai valutato un solo alert).
          #
          # Il token atteso e' un PAT **fine-grained** con un solo permesso
          # repository, "Dependabot alerts: Read-only", e accesso al solo
          # `SYDBioedilizia`. Un PAT classic con `security_events` funziona ma
          # e' un permesso di ACCOUNT, non di repo: non usarlo.
          GH_TOKEN: '${{ secrets.DEPENDABOT_ALERTS_TOKEN }}'
        run: |
          set -euo pipefail

          # Diagnostica esplicita invece di un 403 opaco. Un gate di sicurezza
          # che non riesce a girare deve essere rosso -- ma rosso con scritto
          # *perche'*, altrimenti si finisce a ignorarlo (che e' esattamente
          # quello che e' successo per due settimane).
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret DEPENDABOT_ALERTS_TOKEN mancante o non visibile -- questo job non puo' girare."
            echo ""
            echo "L'API Dependabot alerts non e' accessibile al GITHUB_TOKEN integrato."
            echo "Serve un PAT fine-grained con accesso al solo ${REPO} e un solo"
            echo "permesso repository: 'Dependabot alerts: Read-only'."
            echo ""
            echo "Va salvato come ENVIRONMENT secret dell'environment 'dependabot-alerts'"
            echo "(non come repository secret):"
            echo ""
            echo "  gh secret set DEPENDABOT_ALERTS_TOKEN --repo ${REPO} --env dependabot-alerts"
            echo ""
            echo "Se il secret esiste ma il job lo vede vuoto, il run non parte da 'main':"
            echo "l'environment ha una deployment branch policy che ammette solo main."
            exit 1
          fi

          # Nessun `--jq`/`-q` su questa chiamata, ed e' deliberato: con
          # `--paginate`, gh applica il filtro A OGNI PAGINA e ne concatena i
          # risultati, producendo piu' documenti JSON (`[...]` `[...]`).
          # La versione originale del job faceva proprio cosi', e su piu' di
          # una pagina il `jq 'length'` a valle avrebbe emesso due numeri,
          # facendo esplodere il `[ "$count" -gt 0 ]` con "integer expression
          # expected". Non si era mai visto perche' il job non e' mai arrivato
          # a questa riga (moriva prima sul 403), ma il caso e' reale: questo
          # repo ha gia' superato le 100 alert storiche, quindi l'endpoint
          # pagina davvero.
          #
          # Senza filtro, invece, gh FONDE le pagine in un unico array valido
          # (verificato: 178 elementi in un solo documento), che e' quello che
          # il jq successivo si aspetta.
          http_status=0
          alerts_raw="$(gh api "repos/$REPO/dependabot/alerts" --paginate 2>"$RUNNER_TEMP/gh_err")" || http_status=$?

          if [ "$http_status" -ne 0 ]; then
            echo "::error::Chiamata all'API Dependabot alerts fallita -- il gate non ha valutato nulla."
            # Solo la prima riga: e' quella con lo stato HTTP, ed evita di
            # riversare in un log pubblico un corpo di risposta arbitrario.
            # (Actions maschera comunque i valori dei secret, ma non e' una
            # ragione per stampare piu' del necessario.)
            head -n 1 "$RUNNER_TEMP/gh_err" || true
            echo ""
            echo "Cause tipiche, in ordine di probabilita':"
            echo "  - HTTP 401: il PAT fine-grained e' SCADUTO. Rigenerarlo e"
            echo "    riscrivere il secret; la scadenza e' obbligatoria per questo"
            echo "    tipo di token, quindi succedera' di nuovo -- e' voluto."
            echo "  - HTTP 403: al token manca il permesso repository"
            echo "    'Dependabot alerts: Read-only', oppure non include ${REPO}."
            echo "  - HTTP 404: il token e' valido ma non vede il repo (resource"
            echo "    owner sbagliato in fase di creazione)."
            exit 1
          fi

          alerts="$(printf '%s' "$alerts_raw" | jq '[.[] | select(.state == "open") | select(.security_advisory.severity == "high" or .security_advisory.severity == "critical")]')"

          # Si calcola SOLO il conteggio: i dettagli non servono a nulla qui
          # (vedi il commento sotto sui log pubblici), e cio' che non viene
          # estratto non puo' finire per sbaglio in un `echo`.
          now_epoch="$(date -u +%s)"
          count="$(printf '%s' "$alerts" | jq --argjson now "$now_epoch" --argjson maxAge "$MAX_AGE_DAYS" '
            [.[]
             | (($now - (.created_at | fromdateiso8601)) / 86400 | floor)
             | select(. >= $maxAge)] | length')"

          if [ "$count" -gt 0 ]; then
            # I dettagli (pacchetto, severita', advisory) NON vanno stampati.
            # Questo repo e' pubblico, quindi i log delle Actions sono
            # leggibili da chiunque -- mentre gli alert Dependabot sono
            # visibili solo a chi ha write. Stampare l'elenco significherebbe
            # pubblicare una lista curata di vulnerabilita' high/critical
            # ancora NON corrette: esattamente il materiale che serve a chi
            # cerca un bersaglio. I manifest sono pubblici e un attaccante
            # potrebbe ricostruire buona parte da solo, ma confermargliele e
            # ordinargliele per anzianita' e' un regalo gratuito.
            #
            # Il conteggio basta a far fallire il build; i dettagli stanno a
            # un click, dietro autenticazione.
            echo "::error::$count high/critical Dependabot alert(s) have been open for >= ${MAX_AGE_DAYS} days with no resolution."
            echo ""
            echo "Dettagli deliberatamente non stampati (log pubblici). Elenco completo:"
            echo "  https://github.com/${REPO}/security/dependabot?q=is%3Aopen"
            echo ""
            echo "If Dependabot could not generate a fix PR on its own (check the"
            echo "'Dependabot Updates' workflow runs for 'conflicting-dependencies'"
            echo "errors), a manual override/patch is required -- see PR #307 for"
            echo "the pattern (js-yaml/nanoid version overrides + surgical lockfile"
            echo "edit) used the last time this happened."
            echo ""
            echo "Se invece Dependabot HA aperto le PR ma sono tutte rosse su"
            echo "pip-audit/npm audit, e' il deadlock incrociato: ogni PR fallisce"
            echo "sulle vulnerabilita' che le altre correggono -- serve un branch"
            echo "consolidato che le unisca (vedi PR #308 e #336)."
            exit 1
          fi

          echo "No stale high/critical Dependabot alerts (threshold: ${MAX_AGE_DAYS} days)."
