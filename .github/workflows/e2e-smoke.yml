name: 'E2E Smoke'

on:
  push:
    branches:
      - 'main'
      - 'develop'
    paths:
      - 'web_client/**'
      # Workspace root: lockfile + npm config that resolve web_client deps.
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/e2e-smoke.yml'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
  pull_request:
    branches:
      - 'main'
      - 'develop'
    paths:
      - 'web_client/**'
      # Workspace root: lockfile + npm config that resolve web_client deps.
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/e2e-smoke.yml'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'

# Least privilege: read-only checkout, artifact upload uses the default token.
permissions:
  contents: read

concurrency:
  group: 'e2e-smoke-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  smoke:
    name: 'Playwright smoke (chromium)'
    runs-on: 'ubuntu-latest'
    # Official Playwright image: Chromium and its system libraries are baked in,
    # so the job never runs `apt-get` against the runner's Ubuntu mirror (on
    # 7 Oct 2026 azure.archive.ubuntu.com served ~80 KB/s and `--with-deps` hung
    # for 7+ min). The tag MUST match the locked @playwright/test version, and
    # Dependabot does not update container images in workflows: bump tag + digest
    # by hand with Playwright. If they drift, the install step below downloads
    # the matching browser from Playwright's CDN instead of failing.
    container:
      image: 'mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea'
    # Fail fast instead of hanging for the 6 h default (normal run: ~3 min).
    timeout-minutes: 20

    defaults:
      run:
        working-directory: './web_client'

    # Placeholder public config — the build/serve must not require live secrets.
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: 'ci-placeholder-api-key'
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'ci-placeholder.firebaseapp.com'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'ci-placeholder'
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: 'ci-placeholder-recaptcha'
      NEXT_PUBLIC_ENABLE_APP_CHECK: 'false'

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 'Set up Node.js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      # Node 24 bundles npm 11; the lockfile toolchain is npm 10 (see
      # .claude/rules/frontend.md). Pin it so CI resolves like the lockfile.
      - name: 'Pin npm 10 (lockfile toolchain)'
        run: npm install -g npm@10.9.9 && npm -v

      - name: 'Install dependencies'
        run: npm ci

      # No `--with-deps`: the image already has the system libraries. A no-op
      # when the image matches the locked Playwright version.
      - name: 'Install Playwright browser (chromium)'
        run: npx playwright install chromium

      - name: 'Production build'
        run: npm run build

      - name: 'Run smoke tests'
        run: npm run test:e2e

      - name: 'Upload Playwright report'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'playwright-report'
          path: 'web_client/playwright-report/'
          retention-days: 7
          if-no-files-found: 'ignore'

  authed:
    name: 'Playwright authed (Firebase emulators)'
    runs-on: 'ubuntu-latest'
    # Same image and pin as the smoke job — keep the two in sync.
    container:
      image: 'mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea'
    timeout-minutes: 25
    # Intentionally NOT `needs: smoke` — the two run in parallel and fail
    # independently, so a broken login can never mask the public smoke result
    # (or be masked by it).

    # The emulator build is a *different* artifact from the smoke build:
    # NEXT_PUBLIC_* are inlined at build time, so emulator mode cannot be
    # toggled on an already-built app. These must match `build:e2e` and
    # playwright.emulator.config.ts.
    env:
      NEXT_DIST_DIR: '.next-e2e'
      NEXT_PUBLIC_FIREBASE_EMULATOR: 'true'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'demo-syd-e2e'
      NEXT_PUBLIC_FIREBASE_API_KEY: 'demo-api-key'
      # The test server's host: signInWithRedirect on, as in production.
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: '127.0.0.1:3100'
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'demo-syd-e2e.appspot.com'
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: 'ci-placeholder-recaptcha'
      NEXT_PUBLIC_ENABLE_APP_CHECK: 'false'
      # Pinned so an upstream release cannot change emulator behaviour silently.
      FIREBASE_TOOLS_VERSION: '14.27.0'

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 'Set up Node.js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      # Node 24 bundles npm 11; the lockfile toolchain is npm 10 (see
      # .claude/rules/frontend.md). Pin it so CI resolves like the lockfile.
      - name: 'Pin npm 10 (lockfile toolchain)'
        run: npm install -g npm@10.9.9 && npm -v

      # The Firestore emulator is a JVM binary. The Playwright image has no JDK,
      # so install one (Temurin, downloaded from Adoptium — not apt), then
      # assert it is on PATH so a setup change fails loudly instead of mid-suite.
      - name: 'Set up Java (Firestore emulator runtime)'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 'Verify Java is available (Firestore emulator runtime)'
        run: java -version

      - name: 'Install dependencies'
        working-directory: './web_client'
        run: npm ci

      - name: 'Install Playwright browser (chromium)'
        working-directory: './web_client'
        run: npx playwright install chromium

      - name: 'Production build (emulator env)'
        working-directory: './web_client'
        run: npm run build:e2e

      # Run from the repo root: firebase.json, firestore.rules and
      # firestore.indexes.json all live there.
      - name: 'Run authenticated E2E against the emulators'
        run: >-
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
          emulators:exec
          --project demo-syd-e2e
          --only auth,firestore
          "npm --prefix web_client run test:e2e:auth"

      - name: 'Upload Playwright report'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'playwright-report-authed'
          path: 'web_client/playwright-report-authed/'
          retention-days: 7
          if-no-files-found: 'ignore'
