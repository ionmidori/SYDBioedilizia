name: 'E2E Smoke'

on:
  push:
    branches:
      - 'main'
      - 'develop'
    paths:
      - 'web_client/**'
      - '.github/workflows/e2e-smoke.yml'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
  pull_request:
    branches:
      - 'main'
      - 'develop'
    paths:
      - 'web_client/**'
      - '.github/workflows/e2e-smoke.yml'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'

# Least privilege: read-only checkout, artifact upload uses the default token.
permissions:
  contents: read

concurrency:
  group: 'e2e-smoke-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  smoke:
    name: 'Playwright smoke (chromium)'
    runs-on: 'ubuntu-latest'

    defaults:
      run:
        working-directory: './web_client'

    # Placeholder public config — the build/serve must not require live secrets.
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: 'ci-placeholder-api-key'
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'ci-placeholder.firebaseapp.com'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'ci-placeholder'
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: 'ci-placeholder-recaptcha'
      NEXT_PUBLIC_ENABLE_APP_CHECK: 'false'

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 'Set up Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Install Playwright browser (chromium)'
        run: npx playwright install --with-deps chromium

      - name: 'Production build'
        run: npm run build

      - name: 'Run smoke tests'
        run: npm run test:e2e

      - name: 'Upload Playwright report'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'playwright-report'
          path: 'web_client/playwright-report/'
          retention-days: 7
          if-no-files-found: 'ignore'

  authed:
    name: 'Playwright authed (Firebase emulators)'
    runs-on: 'ubuntu-latest'
    # Intentionally NOT `needs: smoke` — the two run in parallel and fail
    # independently, so a broken login can never mask the public smoke result
    # (or be masked by it).

    # The emulator build is a *different* artifact from the smoke build:
    # NEXT_PUBLIC_* are inlined at build time, so emulator mode cannot be
    # toggled on an already-built app. These must match `build:e2e` and
    # playwright.emulator.config.ts.
    env:
      NEXT_DIST_DIR: '.next-e2e'
      NEXT_PUBLIC_FIREBASE_EMULATOR: 'true'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'demo-syd-e2e'
      NEXT_PUBLIC_FIREBASE_API_KEY: 'demo-api-key'
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'demo-syd-e2e.firebaseapp.com'
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'demo-syd-e2e.appspot.com'
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: 'ci-placeholder-recaptcha'
      NEXT_PUBLIC_ENABLE_APP_CHECK: 'false'
      # Pinned so an upstream release cannot change emulator behaviour silently.
      FIREBASE_TOOLS_VERSION: '14.27.0'

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 'Set up Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      # The Firestore emulator is a JVM binary. ubuntu-latest ships a JDK, so
      # no setup-java step is needed; this asserts it is really there so a
      # runner-image change fails loudly instead of mid-suite.
      - name: 'Verify Java is available (Firestore emulator runtime)'
        run: java -version

      - name: 'Install dependencies'
        working-directory: './web_client'
        run: npm ci

      - name: 'Install Playwright browser (chromium)'
        working-directory: './web_client'
        run: npx playwright install --with-deps chromium

      - name: 'Production build (emulator env)'
        working-directory: './web_client'
        run: npm run build:e2e

      # Run from the repo root: firebase.json, firestore.rules and
      # firestore.indexes.json all live there.
      - name: 'Run authenticated E2E against the emulators'
        run: >-
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
          emulators:exec
          --project demo-syd-e2e
          --only auth,firestore
          "npm --prefix web_client run test:e2e:auth"

      - name: 'Upload Playwright report'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 'playwright-report-authed'
          path: 'web_client/playwright-report-authed/'
          retention-days: 7
          if-no-files-found: 'ignore'
