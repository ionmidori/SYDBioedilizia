name: 'Backend Python Tests'

on:
  push:
    branches:
      - 'main'
      - 'develop'
    paths:
      - 'backend_python/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches:
      - 'main'
      - 'develop'
    paths:
      - 'backend_python/**'
      - '.github/workflows/backend-tests.yml'

# Least privilege: this workflow only reads the repo and uploads coverage.
permissions:
  contents: read

# Cancel superseded runs on the same ref (saves CI minutes; keeps only the
# latest push/PR update running).
concurrency:
  group: 'backend-tests-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    name: 'Pytest CI'
    runs-on: 'ubuntu-latest'

    env:
      ENV: 'development'
      FIREBASE_STORAGE_BUCKET: 'test-bucket.firebasestorage.app'
      GOOGLE_CLOUD_PROJECT: 'chatbotluca-a8a73'

    defaults:
      run:
        working-directory: './backend_python'

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 'Set up Python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # MUST track the base image in backend_python/Dockerfile. pyproject
          # allows >=3.12, so CI on an older interpreter than Cloud Run runs
          # would still pass while production hits 3.14-only behaviour.
          python-version: '3.14'

      - name: 'Install uv'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 'latest'

      - name: 'Verify uv.lock is in sync with pyproject.toml'
        # Without this, a PR that raises a floor in pyproject.toml without
        # re-locking looks green here and then ships nothing: the Dockerfile
        # installs from uv.lock, so the old version stays in production. That
        # is what happened to cryptography 49.0.0 (GHSA-g6cj-pr64-35w5) across
        # PRs #282..#288 -- merged, green, and inert until the re-lock in #291.
        run: 'uv lock --check'

      - name: 'Install dependencies'
        # --locked so the suite runs against the resolution the image ships.
        # A bare `uv sync` re-resolves and rewrites uv.lock in place, which
        # means CI would silently test something other than the locked set.
        run: 'uv sync --all-extras --locked'

      - name: 'Lint (ruff)'
        run: 'uv run ruff check src/ main.py tests/'

      - name: 'Type check (pyright)'
        # Incremental-adoption gate: blocks NEW hard type errors. Pre-existing
        # findings are baselined as warnings in pyrightconfig.json (ratchet).
        run: 'uv run pyright'

      - name: 'Dependency audit (supply chain security)'
        # CVE-2026-28277: langgraph msgpack deserialization (transitive via google-adk).
        # Post-exploitation only — requires checkpoint-store write access. No fix available yet.
        # We do not use LangGraph checkpointing; ADK uses InMemorySessionService.
        run: uv run pip-audit --strict --desc --ignore-vuln CVE-2026-28277

      - name: 'Run tests + coverage gate'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GOOGLE_API_KEY: '${{ secrets.GOOGLE_API_KEY }}'
        # --cov-fail-under is a ratchet floor (current total ~59%), not the goal.
        # Raise it as coverage improves.
        run: |
          uv run pytest -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=55 -m "not integration"

      - name: 'Upload coverage'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: 'backend_python/coverage.xml'
          flags: 'backend-python'
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: '${{ secrets.CODECOV_TOKEN }}'
